<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="WaldorfWahlen - Projektwahlen der Waldorfschule Potsdam"
    />

    <meta
      name="google-site-verification"
      content="zPdCzE-gxQdnauAWPkz0UKsT0cSsabVcDTBxlgehzWk"
    />
    <meta name="msvalidate.01" content="403B48D78F85E442E31653A41EC85B13" />

    <!-- Filled -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Outlined -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />

    <!-- Rounded -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />

    <!-- Sharp -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp"
      rel="stylesheet"
    />

    <!-- Two Tone -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Two+Tone"
      rel="stylesheet"
    />

    <script defer src="https://cloud.umami.is/script.js" data-website-id="38e60701-f15f-4143-b29e-d0459cfd4dc9"></script>

    <title>WaldorfWahlen</title>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div part="loader" class="loader">
          <div part="indicator" class="indeterminate"></div>

          <div class="slow-loading" style="display: none;">
            <p>
              Das Laden der Seite dauert länger als erwartet. Bitte haben Sie
              noch einen Moment Geduld &nbsp;
            </p>
            <span id="dots">
              <span>.</span>
              <span>.</span>
              <span>.</span>
            </span>
            <script>
              let visibleDots = 1;
              const allDots = document.querySelectorAll("#dots span");
              setInterval(() => {
                allDots.forEach((dot, i) => {
                  if (i < visibleDots) {
                    dot.style.visibility = "visible";
                    dot.style.opacity = "1";
                  } else {
                    dot.style.visibility = "hidden";
                    dot.style.opacity = "0.3";
                  }
                });
                visibleDots = visibleDots === allDots.length ? 0 : visibleDots + 1;
              }, 600);
            </script>
          </div>
        </div>

        <noscript>
          <div
            style="
              position: fixed;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              background-color: var(--background-color);
              display: flex;
              justify-content: center;
              align-items: center;
              color: white;
              font-size: 2rem;
            "
          >
            <p>
              Diese Seite benötigt JavaScript um zu funktionieren. Bitte
              aktivieren Sie JavaScript in Ihrem Browser.
            </p>
          </div>
        </noscript>
      </div>
    </div>
    <style>
      body {
        padding: 0px;
        margin: 0px;
      }
      :root {
        --shape-corner: 0;
        --background-color: #1f1b16;
        --loader-background-color: #37322d;
        --primary-color: #ffffff;
      }

      .loading {
        height: 100dvh;
        width: 100dvw;
        background-color: var(--background-color);
      }
      .loader {
        position: fixed;
        display: inline-block;
        width: 100%;
        height: 4px;
        overflow: hidden;
        border-radius: var(--shape-corner);
        background-color: var(--loader-background-color);
      }

      .indeterminate::before,
      .indeterminate::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        background-color: var(--primary-color);
      }

      .indeterminate::before {
        left: 0;
        animation: indeterminate-animation 2s linear infinite;
      }

      .indeterminate::after {
        left: 0;
        animation: indeterminate-short-animation 2s linear infinite;
      }

      @keyframes indeterminate-animation {
        0% {
          left: 0;
          width: 0;
        }
        50% {
          left: 30%;
          width: 70%;
        }
        75% {
          left: 100%;
          width: 0;
        }
      }

      @keyframes indeterminate-short-animation {
        0%,
        50% {
          left: 0;
          width: 0;
        }
        75% {
          left: 0;
          width: 25%;
        }
        100% {
          left: 100%;
          width: 0;
        }
      }

      .slow-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-size: 1.5rem;
        font-weight: 300;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
        background: linear-gradient(135deg, #1f1b16 0%, #2a241e 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      .slow-loading p {
        margin: 0 0 1.5rem 0;
        max-width: 600px;
        line-height: 1.6;
        opacity: 0.9;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      
      #dots {
        display: inline-flex;
        align-items: center;
        margin-left: 0.5rem;
      }
      
      #dots span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ffffff;
        margin: 0 3px;
        opacity: 0.6;
        animation: pulse 1.5s ease-in-out infinite;
      }
      
      #dots span:nth-child(1) {
        animation-delay: 0s;
      }
      
      #dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      
      #dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      
      @keyframes pulse {
        0%, 80%, 100% {
          opacity: 0.3;
          transform: scale(1);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
    <script>
      setTimeout(() => {
        const slowLoadingElement = document.querySelector(".slow-loading");
        if (slowLoadingElement) {
          slowLoadingElement.style.display = "flex";
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
